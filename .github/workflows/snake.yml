name: Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#050505&color_dots=#ebedf0,#d4d4d4,#a3a3a3,#6f6f6f,#2c2c2c
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#2e2e2e,#555555,#8f8f8f,#e6e6e6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
