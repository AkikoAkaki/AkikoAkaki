name: Recent writing
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://akiliu.vercel.app/notes/index.xml,https://akiliu.vercel.app/textlab/index.xml,https://akiliu.vercel.app/weeknotes/index.xml"
          max_post_count: 5
          date_format: "yyyy-mm-dd"
          template: "$newline- [$title]($url) <sub>$date</sub>"
